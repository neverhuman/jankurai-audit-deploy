# Vendored copy of the hub installer.
# jankurai-installer.sh in this repo is a byte-identical copy of
# jankurai-installer.sh in the hub repository, so the installer this repo
# publishes with a release is the same verified installer the hub ships.
# It is never hand-edited: re-copy it from the hub and update sha256 and
# source_commit here (`bash scripts/sync-hub-installer.sh <hub checkout>`).

schema_version = "1.0.0"
path = "jankurai-installer.sh"
source_repo = "root/jankurai"
source_path = "jankurai-installer.sh"
# Hub commit that last changed the installer.
source_commit = "1d4f2c795b76521059bdf2e9b048b21704badcd5"
sha256 = "ef514934bf616649f70269f21a044012b94330c058628d7950ce8a75d9d0d27c"
# Release from the hub family.lock. The installer's own default tag (hub bytes)
# tracks this.
family_release = "1.7.4"
# Newest release actually published. The action.yml release-tag default and the
# docs/install.md command track this, so @main never points at a tag that does not
# exist yet. It moves to family_release once the hub has published that release.
published_release = "1.7.3"

# The release-signing public key the installer pins (release_keys table). The
# key file is vendored byte-for-byte from the hub's release-keys/ directory,
# where the owner committed it in root/jankurai PR #11 (merged as
# cf5e0c8b078a978a5396af329460a116d7acc08b) after generating the pair with the
# hub's ops/release/generate-signing-key.sh. scripts/check-vendored-installer.sh
# requires sha256(release_signer_path) == release_signer_sha256 == the installer's pin,
# and, in the required lane, that the installer and every vendored key are the
# hub's bytes at source_commit / release_signer_source_commit, both on hub main.
release_signer_name = "jankurai-release-2026.pub"
release_signer_path = "agent/vendor/release-keys/jankurai-release-2026.pub"
release_signer_source_path = "release-keys/jankurai-release-2026.pub"
release_signer_source_commit = "cf5e0c8b078a978a5396af329460a116d7acc08b"
release_signer_sha256 = "99f48af11e4e6463544652ddfaefb0e9953de15fb0802b174123ac2907ff06fc"
# First tag the key signs; the empty last tag in the installer pin means the
# key stays current until a rotation closes its range.
release_signer_first_tag = "v1.7.2"
# The installer's whole release_keys table, line for line (name|sha256|first
# tag|last tag). The check refuses any other line, so a key cannot be added and a
# range cannot be closed or moved without changing this list, and every key
# named here must be vendored in agent/vendor/release-keys/ with this SHA-256.
release_signers_table = [
  "jankurai-release-2026.pub|99f48af11e4e6463544652ddfaefb0e9953de15fb0802b174123ac2907ff06fc|v1.7.2|",
]
