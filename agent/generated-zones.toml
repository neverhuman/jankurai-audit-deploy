# Generated zones for jankurai-deploy.
# The only generated output tree committed-or-produced in this repo is target/,
# written by the Rust and CI build commands. It is never hand-edited and is
# regenerated by the build. Other generated trees (dist/, .fusion/,
# package-lock.json) are not present in this deploy repo and are intentionally
# not declared so the audit only tracks zones that actually exist here.

# target/ is absent from a clean checkout, so it is optional auditor/build
# output (as in jankurai-core), not a file that must exist.
[[zone]]
path = "target/"
source = "Rust and CI build commands (ops/ci/*.sh)"
command = "bash scripts/ci-local.sh required"
read_only = true
write_policy = "auditor_output"

# jankurai-installer.sh is deliberately not a generated zone. It is a
# vendored, reviewed copy of the hub's installer and must stay byte-identical
# to it, so it cannot carry a `Generated by:` header. Its integrity is enforced
# by the required lane instead: scripts/check-vendored-installer.sh compares it
# with the pinned hash in agent/vendor/hub-installer.lock, and it changes only
# by review through scripts/sync-hub-installer.sh.
