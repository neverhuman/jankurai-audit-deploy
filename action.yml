name: "Jankurai"
description: "Anti-vibe coding standard and local audit CLI for auditable AI-assisted merge"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  release-tag:
    description: "Jankurai release tag to install from neverhuman/jankurai-audit releases"
    required: false
    default: "v1.7.5"
  mode:
    description: "Audit mode: advisory, ratchet, or release"
    required: false
    default: "advisory"
  baseline:
    description: "Path to accepted baseline score JSON (required for ratchet or release mode)"
    required: false
    default: "agent/baselines/main.repo-score.json"

runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22

    - name: Install released jankurai
      shell: bash
      env:
        JANKURAI_RELEASE_TAG: ${{ inputs.release-tag }}
      run: bash "$GITHUB_ACTION_PATH/jankurai-installer.sh"

    - name: Prepare jankurai artifact directories
      shell: bash
      run: mkdir -p target/jankurai target/jankurai/security

    - name: Run jankurai audit
      shell: bash
      env:
        JANKURAI_MODE: ${{ inputs.mode }}
        JANKURAI_BASELINE: ${{ inputs.baseline }}
      run: |
        case "$JANKURAI_MODE" in
          advisory) baseline_args=() ;;
          ratchet|release) baseline_args=(--baseline "$JANKURAI_BASELINE") ;;
          *) echo "jankurai action: unknown mode: $JANKURAI_MODE" >&2; exit 2 ;;
        esac
        jankurai audit . --mode "$JANKURAI_MODE" "${baseline_args[@]}" --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl

    - name: Publish jankurai summary
      shell: bash
      if: always()
      run: |
        if [ -f target/jankurai/summary.md ]; then
          cat target/jankurai/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
